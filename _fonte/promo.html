<!doctype html>
<html lang="{{config.lang}}">
<head>
<!-- GERADO por _montar.cjs. Página de saída (back redirect): {{p.saida}}. Checkout em config.checkout.saida. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{promo.titulo}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E1A17">
<script>
  window.PIXEL_META_ID = '{{config.pixelMeta}}';
  if (window.PIXEL_META_ID.indexOf('TROCAR') === -1) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', window.PIXEL_META_ID);
    fbq('track', 'PageView');
  }
</script>
<script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--tinta:#1E1A17;--texto:#2B2622;--mudo:#6A6159;--papel:#FBF8F3;--areia:#F2ECE2;--linha:#E3D9CA;--argila:#9A4A2B;--pele:#D9A27A;--cta:#1E6A46;--cta-esc:#165237;--vermelho:#A23B2A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--papel);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased}
.topo{background:var(--tinta);color:#EFE7DC;font-weight:600;font-size:14px;text-align:center;padding:10px 16px}
.caixa{max-width:540px;margin:0 auto;padding:30px 16px 48px;text-align:center}
.pill{display:inline-block;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--argila);border:1px solid #DDC3B2;background:#FFF9F4;padding:7px 12px;border-radius:999px}
h1{font-family:Newsreader,Georgia,serif;font-weight:600;color:var(--tinta);font-size:clamp(30px,7vw,42px);line-height:1.12;margin-top:14px}
.sub{margin-top:12px;font-size:16.5px}
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;margin:22px auto 0;border:1.5px dashed #BFB09C;border-radius:12px;background:repeating-linear-gradient(135deg,#F5EFE6 0 12px,#F1EADF 12px 24px);color:#8A7B69;font-weight:600;font-size:13.5px;padding:16px}
.cartao{background:#fff;border:2px solid var(--tinta);border-radius:16px;padding:22px;margin-top:22px}
ul{list-style:none;text-align:left}
li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--linha);font-size:15px}
li::before{content:"✓";color:var(--cta);font-weight:800}
.de{margin-top:18px;color:var(--mudo)}
.de s{color:var(--vermelho)}
.preco{font-family:Newsreader,Georgia,serif;font-size:58px;font-weight:600;color:var(--tinta);line-height:1.05}
.btn{display:block;margin-top:16px;text-decoration:none;background:var(--cta);color:#fff;font-weight:700;font-size:18px;padding:19px;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:hover{background:var(--cta-esc)}
.nota{font-size:13px;color:var(--mudo);margin-top:12px}
</style>
</head>
<body>
<div class="topo">{{promo.topo}}</div>
<main class="caixa">
  <span class="pill">{{promo.pill}}</span>
  <h1>{{promo.h1}}</h1>
  <p class="sub">{{promo.sub}}</p>
  <div class="ph">{{promo.ph}}</div>
  <div class="cartao">
    <ul>{{#promo.itens}}<li><span>{{.}}</span></li>{{/promo.itens}}</ul>
    <p class="de">{{promo.de}} <s>{{p.essencial}}</s> {{promo.por}}</p>
    <div class="preco">{{p.saida}}</div>
    <!-- CHECKOUT Back Redirect ({{p.saida}}): config.checkout.saida -->
    <a class="btn" data-checkout data-valor="{{config.precos.saida}}" href="{{config.checkout.saida}}">{{promo.cta}}</a>
    <p class="nota">{{promo.nota}}</p>
  </div>
</main>
<script>
(function () {
  var q = location.search.replace(/^\?/, '');
  document.querySelectorAll('a[data-checkout]').forEach(function (a) {
    var h = a.getAttribute('href') || '';
    if (q && /^https?:/.test(h)) a.href = h + (h.indexOf('?') >= 0 ? '&' : '?') + q;
    a.addEventListener('click', function (e) {
      if (h.indexOf('TROCAR') !== -1) { e.preventDefault(); alert('{{config.avisoTrocar}}'); return; }
      try { fbq('track', 'InitiateCheckout', { value: Number(a.getAttribute('data-valor')) || 0, currency: 'USD' }); } catch (err) {}
    });
  });
})();
</script>
</body>
</html>
